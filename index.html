<!doctype html>
<html lang="es" class="dark">

<head>
  <!-- html2canvas loaded dynamically via npm import in FormationModal.jsx -->
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: sin esto env(safe-area-inset-*) vale 0 en iPhone y la app instalada queda bajo la barra de inicio -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- El manifest (PWA del draft) lo agrega main.jsx solo bajo /draft: la web pública no ofrece instalar el draft. -->
  <meta name="theme-color" content="#080b14">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Favicon chico: antes el ícono de 512 px (74 KB) se descargaba en cada primera visita -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

  <!-- Vistas previas de links. scripts/build-share-pages.mjs reemplaza este bloque en cada página (utils/sharePages.js). -->
  <!-- share:start -->
  <title>SuperContinental League</title>
  <meta name="description" content="La liga de eFootball PES 2021: resultados, tabla, copas y la historia de cada club.">
  <link rel="canonical" href="https://supercontinental-draft.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SuperContinental League">
  <meta property="og:locale" content="es_AR">
  <meta property="og:url" content="https://supercontinental-draft.vercel.app/">
  <meta property="og:title" content="SuperContinental League">
  <meta property="og:description" content="La liga de eFootball PES 2021: resultados, tabla, copas y la historia de cada club.">
  <meta property="og:image" content="https://supercontinental-draft.vercel.app/og/liga.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SuperContinental League">
  <meta name="twitter:description" content="La liga de eFootball PES 2021: resultados, tabla, copas y la historia de cada club.">
  <meta name="twitter:image" content="https://supercontinental-draft.vercel.app/og/liga.png">
  <!-- share:end -->
  <script src="/boot.js"></script>
</head>

</body>

</html>
