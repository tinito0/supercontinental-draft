# Publishes the Supabase Edge Function `match-feed` (docs/MATCH_FEED.md): receives the bridge's live matches and writes live_matches,
# match_lines, the prediction closing and the automatic OBS popups/cards, from GitHub, like deploy-market.
# Manual: Actions → deploy-match-feed → Run workflow (works from the phone). Only from master, and only after its tests
# pass. Uses the repository secret SUPABASE_ACCESS_TOKEN; the function's own secrets (FIREBASE_SERVICE_ACCOUNT, MATCH_FEED_TOKEN) live in
# Supabase and are not touched.
name: deploy-match-feed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-match-feed
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Match summaries, the compact lines, the overlay automation and the prediction closing it shares with community-vote.
      - run: npx vitest run tests/matchFeed.test.js tests/matchLines.test.js tests/overlayControl.test.js tests/communityVote.test.js --reporter=default --reporter=github-actions
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy match-feed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."; exit 1; }
          # --no-verify-jwt: the bridge is not a Supabase or Firebase user; it signs with MATCH_FEED_TOKEN.
          supabase functions deploy match-feed --no-verify-jwt --project-ref pcmhsucbtonnaikiatuy --yes
