# Keeps the Supabase Free project from pausing for inactivity (supabase/migrations/20261021000000_keepalive.sql).
# Needs repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (sb_publishable_…, sent only as apikey: it is not a JWT).
# GitHub disables scheduled workflows after 60 days without commits in a public repository: re-enable it in
# Actions if that happens. A red run means the project did not answer (540 = already paused: resume it in the dashboard).
name: supabase-keepalive

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
